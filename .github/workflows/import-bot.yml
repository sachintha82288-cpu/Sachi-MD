name: Import bot source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-bot.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch zip from MediaFire
        run: |
          set -euxo pipefail
          URL='https://www.mediafire.com/file/h3nq642p8ufdwtx/Sachi-MD-Bot-v1.3.0-button-menu.zip/file'
          for i in 1 2 3 4 5; do
            curl -sL --retry 3 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36' "$URL" -o page.html && break || sleep 5
          done
          echo "page bytes: $(wc -c < page.html)"
          DIRECT=$(grep -oE 'https://download[0-9]*\.mediafire\.com/[^"<>\\ ]+' page.html | head -1)
          echo "direct=$DIRECT"
          test -n "$DIRECT"
          curl -L -A 'Mozilla/5.0' "$DIRECT" -o bot.zip --retry 3
          ls -l bot.zip
          file bot.zip
          unzip -l bot.zip | head -40

      - name: Extract into repo
        run: |
          set -euxo pipefail
          rm -rf bot
          mkdir -p bot
          unzip -q -o bot.zip -d bot
          # flatten a single nested top-level folder if present
          COUNT=$(ls -1A bot | wc -l)
          FIRST=$(ls -1A bot | head -1)
          if [ "$COUNT" = "1" ] && [ -d "bot/$FIRST" ]; then
            mv "bot/$FIRST" tmp_mv && rm -rf bot && mv tmp_mv bot
          fi
          find bot -maxdepth 2 | head -60
          du -sh bot
          echo "zip sha256: $(sha256sum bot.zip)"

      - name: Commit and push
        run: |
          set -euxo pipefail
          git config user.name 'Sachi MD Bot Importer'
          git config user.email 'noreply@github.com'
          rm -f page.html
          git add -A
          git commit -m "Import Sachi-MD-Bot v1.3.0 (button menu) source" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
